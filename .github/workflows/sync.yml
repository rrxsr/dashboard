name: Sync broneeringud

on:
  schedule:
    - cron: '0 * * * *'   # iga tund automaatselt
  workflow_dispatch:        # käsitsi käivitus GitHubis

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Seadista Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installi sõltuvused
        run: pip install requests icalendar

      - name: Käivita generate.py
        run: python generate.py
        env:
          AIRBNB_ICAL_URL:  ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}

      - name: Commit ja push data.json
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Sync $(date -u '+%d.%m %H:%M') UTC"
          git push
