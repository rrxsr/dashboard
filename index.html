<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayPulse Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;font-family:system-ui,-apple-system,sans-serif;color:#c9d1d9;min-height:100vh;padding:20px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:17px;font-weight:600;color:#e6edf3}.logo span{color:#3b82f6}
.sync-info{display:flex;align-items:center;gap:7px;font-size:11px;color:#6e7681}
.sdot{width:7px;height:7px;border-radius:50%;background:#3fb950;flex-shrink:0}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mc{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px 15px}
.mlbl{font-size:11px;color:#6e7681;margin-bottom:5px}
.mval{font-size:22px;font-weight:600;color:#e6edf3}
.msub{font-size:11px;margin-top:3px;color:#6e7681}
.green{color:#3fb950}.yellow{color:#e3b341}.red{color:#f78166}

/* Layout */
.grid2{display:grid;grid-template-columns:1fr 280px;gap:14px}
.card{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:14px}
.ctitle{font-size:11px;color:#6e7681;text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-bottom:12px}

/* Kalender */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-btn{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:4px 12px;font-size:13px;color:#8b949e;cursor:pointer;transition:border-color .1s}
.cal-btn:hover{border-color:#3b82f6;color:#58a6ff}
.cal-month{font-size:14px;font-weight:500;color:#e6edf3}
.cal-legend{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.lsp{font-size:10px;color:#6e7681;display:flex;align-items:center;gap:4px}
.ldot{width:8px;height:8px;border-radius:2px;display:inline-block}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cdlbl{font-size:10px;color:#484f58;text-align:center;padding:2px 0 6px}
.cc{min-height:40px;border-radius:5px;padding:3px 4px;background:#0d1117;border:1px solid #21262d;cursor:default;transition:border-color .1s}
.cc.empty{background:transparent;border-color:transparent}
.cc .dn{font-size:9px;color:#484f58}
.cc .gn{font-size:9px;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc.airbnb{background:#1a1200;border-color:#e3b341}
.cc.airbnb .dn{color:#9e6a03}.cc.airbnb .gn{color:#e3b341}
.cc.booking{background:#031d2e;border-color:#1f6feb}
.cc.booking .dn{color:#1f6feb}.cc.booking .gn{color:#58a6ff}
.cc.blocked{background:#161b22;border-color:#30363d}
.cc.blocked .dn{color:#484f58}
.cc.today{outline:1.5px solid #58a6ff;outline-offset:-1px}

/* Broneeringute nimekiri */
.bklist{display:flex;flex-direction:column;gap:8px}
.bkrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;background:#0d1117;border:1px solid #21262d}
.bkav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.av-a{background:#2d1b00;color:#e3b341}
.av-b{background:#031d2e;color:#58a6ff}
.bkname{font-size:12px;font-weight:500;color:#e6edf3;flex:1}
.bkdates{font-size:10px;color:#6e7681;margin-top:1px}
.bkprice{font-size:12px;font-weight:500;color:#e6edf3;text-align:right}
.bknights{font-size:10px;color:#484f58;text-align:right}
.badge-a{font-size:9px;padding:1px 6px;border-radius:8px;background:#2d1b00;color:#e3b341;border:1px solid #6e4700}
.badge-b{font-size:9px;padding:1px 6px;border-radius:8px;background:#031d2e;color:#58a6ff;border:1px solid #1f6feb}

/* Tulu ribad */
.rev-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.rev-lbl{font-size:12px;color:#6e7681;width:90px;flex-shrink:0}
.rev-track{flex:1;height:7px;background:#21262d;border-radius:4px;overflow:hidden}
.rev-fill-a{height:100%;background:#e3b341;border-radius:4px;transition:width .4s}
.rev-fill-b{height:100%;background:#3b82f6;border-radius:4px;transition:width .4s}
.rev-val{font-size:12px;font-weight:500;color:#e6edf3;width:55px;text-align:right}

/* Hoiatused */
.alerts{display:flex;flex-direction:column;gap:7px}
.al{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:7px;font-size:11px}
.al.warn{background:#1a1000;color:#e3b341;border:1px solid #3d2800}
.al.info{background:#031d2e;color:#58a6ff;border:1px solid #1f6feb}
.al.ok{background:#051f0a;color:#3fb950;border:1px solid #1a4020}
.aldot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;margin-top:3px}

/* Footer */
.footer{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ft{font-size:11px;color:#484f58}
.ft span{color:#6e7681}

/* Loading */
.loading{text-align:center;padding:60px;color:#484f58;font-size:14px}

@media(max-width:640px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">Stay<span>Pulse</span> <span style="font-size:12px;color:#484f58;font-weight:400">· Raua Modern Sauna Suite</span></div>
    <div class="sync-info">
      <div class="sdot" id="sync-dot"></div>
      <span id="sync-text">Laadib...</span>
    </div>
  </div>

  <div id="app"><div class="loading">Laadib broneeringuid...</div></div>

</div>

<script>
const MONTHS_ET = ['Jaanuar','Veebruar','Märts','Aprill','Mai','Juuni','Juuli','August','September','Oktoober','November','Detsember'];
const MONTHS_GEN = ['jaanuar','veebruar','märts','aprill','mai','juuni','juuli','august','september','oktoober','november','detsember'];
let allBookings = [];
let calYear, calMonth;

function initDate() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
}

function getBookingsForMonth(year, month) {
  const start = new Date(year, month, 1);
  const end   = new Date(year, month + 1, 0);
  return allBookings.filter(b => {
    const bs = new Date(b.start);
    const be = new Date(b.end);
    return bs <= end && be >= start;
  });
}

function getUpcoming() {
  const today = new Date().toISOString().split('T')[0];
  return allBookings
    .filter(b => b.end >= today && b.platform !== 'blocked')
    .sort((a,b) => a.start.localeCompare(b.start))
    .slice(0, 5);
}

function calcOccupancy(year, month) {
  const dim = new Date(year, month + 1, 0).getDate();
  const bks = getBookingsForMonth(year, month);
  const occupied = new Set();
  bks.forEach(b => {
    if (b.platform === 'blocked') return;
    let d = new Date(b.start);
    const e = new Date(b.end);
    while (d < e) {
      if (d.getFullYear() === year && d.getMonth() === month)
        occupied.add(d.getDate());
      d.setDate(d.getDate() + 1);
    }
  });
  return { days: occupied.size, total: dim, pct: Math.round(occupied.size / dim * 100) };
}

function getDayBooking(year, month, day) {
  const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  return allBookings.find(b => b.start <= ds && b.end > ds) || null;
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getDate()}. ${MONTHS_GEN[d.getMonth()]}`;
}

function nightsBetween(start, end) {
  return Math.round((new Date(end) - new Date(start)) / 86400000);
}

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function renderCalendar() {
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const offset   = firstDay === 0 ? 6 : firstDay - 1;
  const dim      = new Date(calYear, calMonth + 1, 0).getDate();
  const today    = new Date();
  let html = '';

  ['E','T','K','N','R','L','P'].forEach(d => html += `<div class="cdlbl">${d}</div>`);
  for (let i = 0; i < offset; i++) html += `<div class="cc empty"></div>`;

  for (let d = 1; d <= dim; d++) {
    const bk = getDayBooking(calYear, calMonth, d);
    const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===d;
    let cls = 'cc';
    let guestHtml = '';
    if (bk) {
      cls += ' ' + bk.platform;
      if (bk.platform !== 'blocked') {
        const short = (bk.guest || '').split(' ')[0];
        guestHtml = `<div class="gn">${short}</div>`;
      }
    }
    if (isToday) cls += ' today';
    html += `<div class="${cls}"><div class="dn">${d}</div>${guestHtml}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
  document.getElementById('cal-title').textContent = MONTHS_ET[calMonth] + ' ' + calYear;
}

function render(data) {
  allBookings = data.bookings || [];
  initDate();

  // Sync info
  const updated = data.updated ? new Date(data.updated) : null;
  document.getElementById('sync-dot').style.background = '#3fb950';
  document.getElementById('sync-text').textContent = updated
    ? `Sünkroonitud ${updated.getDate()}. ${MONTHS_GEN[updated.getMonth()]} kell ${updated.toLocaleTimeString('et-EE',{hour:'2-digit',minute:'2-digit'})}`
    : 'Sünkroonitud';

  // Stats
  const now   = new Date();
  const occ   = calcOccupancy(now.getFullYear(), now.getMonth());
  const bksThisMonth = getBookingsForMonth(now.getFullYear(), now.getMonth())
    .filter(b => b.platform !== 'blocked');
  const airCount = bksThisMonth.filter(b => b.platform === 'airbnb').length;
  const bkCount  = bksThisMonth.filter(b => b.platform === 'booking').length;

  // Upcoming
  const upcoming = getUpcoming();
  const nextBk   = upcoming[0];

  // Alerts
  const alerts = [];
  if (occ.pct < 50) alerts.push({type:'warn', msg:`Täituvus ${occ.pct}% — kaaluge hindade alandamist`});
  if (nextBk) {
    const daysUntil = Math.round((new Date(nextBk.start) - now) / 86400000);
    if (daysUntil <= 2) alerts.push({type:'warn', msg:`Sisseregistreerimine ${daysUntil === 0 ? 'täna' : daysUntil === 1 ? 'homme' : `${daysUntil} päeva pärast`} — ${nextBk.guest.split(' ')[0]}`});
  }
  alerts.push({type:'ok', msg:`Mõlemad iCal feed'id aktiivsed`});

  // Revenue bars (broneeringute arv suhtena, kuna hinda pole iCal-is)
  const total = airCount + bkCount || 1;
  const airPct = Math.round(airCount / total * 100);
  const bkPct  = Math.round(bkCount  / total * 100);

  document.getElementById('app').innerHTML = `
    <div class="metrics">
      <div class="mc">
        <div class="mlbl">Selle kuu broneeringud</div>
        <div class="mval">${bksThisMonth.length}</div>
        <div class="msub">Airbnb ${airCount} · Booking ${bkCount}</div>
      </div>
      <div class="mc">
        <div class="mlbl">Täituvus</div>
        <div class="mval">${occ.pct}%</div>
        <div class="msub ${occ.pct >= 70 ? 'green' : occ.pct >= 40 ? 'yellow' : 'red'}">${occ.days}/${occ.total} päeva</div>
      </div>
      <div class="mc">
        <div class="mlbl">Kõik broneeringud</div>
        <div class="mval">${allBookings.filter(b=>b.platform!=='blocked').length}</div>
        <div class="msub">iCal sünkroonitud</div>
      </div>
      <div class="mc">
        <div class="mlbl">Järgmine külaline</div>
        <div class="mval" style="font-size:16px;padding-top:4px">${nextBk ? nextBk.guest.split(' ')[0] : '—'}</div>
        <div class="msub yellow">${nextBk ? formatDate(nextBk.start) + ' · ' + (nextBk.platform === 'airbnb' ? 'Airbnb' : 'Booking') : 'Broneeringuid pole'}</div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="cal-header">
          <button class="cal-btn" id="prev-btn">&#8592;</button>
          <span class="cal-month" id="cal-title"></span>
          <button class="cal-btn" id="next-btn">&#8594;</button>
        </div>
        <div class="cal-legend">
          <span class="lsp"><span class="ldot" style="background:#e3b341"></span>Airbnb</span>
          <span class="lsp"><span class="ldot" style="background:#3b82f6"></span>Booking.com</span>
          <span class="lsp"><span class="ldot" style="background:#21262d;border:1px solid #30363d"></span>Blokeeritud</span>
        </div>
        <div class="cgrid" id="cal-grid"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card">
          <div class="ctitle">Tulevased broneeringud</div>
          <div class="bklist">
            ${upcoming.length === 0 ? '<div style="font-size:12px;color:#484f58">Broneeringuid pole</div>' :
              upcoming.map(b => {
                const nights = nightsBetween(b.start, b.end);
                const av = initials(b.guest);
                const isA = b.platform === 'airbnb';
                return `<div class="bkrow">
                  <div class="bkav ${isA ? 'av-a' : 'av-b'}">${av}</div>
                  <div style="flex:1">
                    <div class="bkname">${b.guest}</div>
                    <div class="bkdates">${formatDate(b.start)}–${formatDate(b.end)} · <span class="${isA ? 'badge-a' : 'badge-b'}">${isA ? 'Airbnb' : 'Booking'}</span></div>
                  </div>
                  <div>
                    <div class="bknights">${nights} öö${nights !== 1 ? 'd' : ''}</div>
                  </div>
                </div>`;
              }).join('')
            }
          </div>
        </div>

        <div class="card">
          <div class="ctitle">Platvormide jaotus</div>
          <div class="rev-row">
            <div class="rev-lbl">Airbnb</div>
            <div class="rev-track"><div class="rev-fill-a" style="width:${airPct}%"></div></div>
            <div class="rev-val">${airCount} bron.</div>
          </div>
          <div class="rev-row">
            <div class="rev-lbl">Booking.com</div>
            <div class="rev-track"><div class="rev-fill-b" style="width:${bkPct}%"></div></div>
            <div class="rev-val">${bkCount} bron.</div>
          </div>
          <div style="font-size:10px;color:#484f58;margin-top:4px">Hinda iCal ei sisalda</div>
        </div>

        <div class="card">
          <div class="ctitle">Märguanded</div>
          <div class="alerts">
            ${alerts.map(a => `<div class="al ${a.type}"><div class="aldot"></div><div>${a.msg}</div></div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="ft">GitHub Pages · <span id="footer-url">kasutajanimi.github.io/dashboard</span></div>
      <div class="ft">Automaatne sync iga tund · GitHub Actions</div>
    </div>
  `;

  // Kalender
  renderCalendar();

  document.getElementById('prev-btn').onclick = () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  };
  document.getElementById('next-btn').onclick = () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  };
}

// Lae data.json
fetch('data.json')
  .then(r => {
    if (!r.ok) throw new Error('data.json ei leitud');
    return r.json();
  })
  .then(data => render(data))
  .catch(err => {
    document.getElementById('sync-dot').style.background = '#f78166';
    document.getElementById('sync-text').textContent = 'Viga laadimisel';
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center;padding:40px;color:#6e7681">
        <div style="font-size:24px;margin-bottom:12px">⚠️</div>
        <div style="font-size:14px;color:#e6edf3;margin-bottom:8px">data.json ei leitud</div>
        <div style="font-size:12px">Käivita kõigepealt <code style="color:#58a6ff">python generate.py</code></div>
      </div>`;
  });
</script>
</body>
</html>
